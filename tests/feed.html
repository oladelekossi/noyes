<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>wheel · test feed</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0f1419;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:600px;margin:45px auto;border:1px solid #eff3f4;border-radius:16px;overflow:hidden}.fixture-label{padding:16px 22px;font-size:12px;color:#536471;letter-spacing:.06em}.tabs{display:flex;border-bottom:1px solid #eff3f4}.tabs button{flex:1;padding:18px;background:transparent;border:0;font:600 15px system-ui;color:#536471}.tabs button[aria-selected=true]{color:#0f1419;box-shadow:inset 0 -3px #1d9bf0}article{padding:20px 22px;border-bottom:1px solid #eff3f4;display:flex;gap:12px}.avatar{height:40px;width:40px;border-radius:50%;background:#eaf3ef;display:grid;place-items:center;color:#3c6b54;font-weight:600;flex-shrink:0}.post-body{flex:1;min-width:0}.header{display:flex;align-items:center;min-height:32px}.header [data-testid=User-Name]{flex:1;min-width:0}.handle,time{color:#536471;font-size:13px}.caret-wrap{width:32px;height:32px;display:flex;flex-shrink:0}[data-testid=caret]{border:0;background:none;color:#536471;width:32px;height:32px;font-size:20px;cursor:pointer}a{color:inherit;text-decoration:none}.post-text{margin:5px 0 16px}.actions{display:flex;justify-content:space-between;color:#536471;font-size:13px}.actions span{min-width:35px}[role=menu]{position:fixed;top:140px;right:170px;background:white;padding:8px;box-shadow:0 3px 24px #0003;border-radius:12px;z-index:99}[role=menuitem]{display:block;padding:12px;border:0;background:white;font:15px system-ui}.native-feedback{padding:20px;background:#eff3f4;color:#536471}.dark{background:#000;color:#e7e9ea}.dark main,.dark article,.dark .tabs{border-color:#2f3336}.dark .tabs button[aria-selected=true]{color:#e7e9ea}.dark .handle,.dark time,.dark .actions,.dark [data-testid=caret]{color:#71767b}
</style></head>
<body><main data-testid="primaryColumn"><div class="fixture-label">wheel / interactive test feed</div><div class="tabs" role="tablist"><button role="tab" aria-selected="true">For you</button><button role="tab" aria-selected="false">Following</button></div><section id="feed"></section></main>
<script>
window.feedback = []; window.otherActions = []; window.menuDelay = 0; window.itemDelay = 0;
window.options = ['Not interested in this post', 'Mute @example', 'Block @example', 'Report post'];
window.addPost = (id, text = 'A thought worth sharing. Small tools can make everyday things feel a little easier.', name = 'Alex', handle = 'alex') => {
 const post = document.createElement('article'); post.dataset.testid = 'tweet';
 post.innerHTML = `<div class="avatar">${name[0]}</div><div class="post-body"><div class="header"><div data-testid="User-Name"><strong>${name}</strong><br><span class="handle">@${handle} · </span><a href="/${handle}/status/${id}"><time>2h</time></a></div><div class="caret-wrap"><button data-testid="caret" aria-label="More">···</button></div></div><p class="post-text">${text}</p><div class="actions"><span>♡ 24</span><span>↻ 3</span><span>▥ 842</span><span>↗</span></div></div>`;
 post.querySelector('[data-testid=caret]').onclick = () => setTimeout(() => {
  document.querySelector('[role=menu]')?.remove();
  const menu = document.createElement('div'); menu.setAttribute('role','menu'); document.body.append(menu);
  setTimeout(() => window.options.forEach(label => {
   const item = document.createElement('button'); item.setAttribute('role','menuitem'); item.textContent = label;
   item.onclick = () => {
    if (label === 'Not interested in this post' || label === 'Not interested in this Tweet') {
     window.feedback.push(id); post.innerHTML = '<div class="native-feedback">We’ll show you fewer posts like this. <button class="undo">Undo</button></div>';
     post.querySelector('.undo').onclick = () => { window.feedback = window.feedback.filter(key => key !== id); post.remove(); window.addPost(id); };
    } else window.otherActions.push(label);
    menu.remove();
   };
   menu.append(item);
  }), window.itemDelay);
 }, window.menuDelay);
 document.querySelector('#feed').append(post); return post;
};
window.addPost('101');
window.addPost('102', 'Apparently every conversation needs to become an argument now.', 'Jordan', 'jordan');
window.addPost('103', 'Made something small today. One button, one useful thing.', 'Sam', 'sam');
document.querySelectorAll('[role=tab]').forEach(tab => tab.onclick = () => {
 document.querySelectorAll('[role=tab]').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
});
</script></body></html>
